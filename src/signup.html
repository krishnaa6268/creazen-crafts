  <body>
    <div class="container">
      <div class="inner-container">
        <div class="left-container">
          <div class="img-overs-container">
            <img class="img-bg"
            src="../assets/images/login/img2.jpg" />

            <div class="text-logo"></div>
          </div>
        </div>

        <div class="right-container poppins">
          <div class="right-inner">
            <div class="p-bar">
              <!-- <div class="segment">
                <div class="left-circle">
                  <img src="./images/check.png" class="tick-icon">
                </div>
                <div class="line"></div>
              </div>
          
              <div class="segment">
                <div class="t-circle">
                  <div class="inner-circle"></div>
                </div>
                <div class="line"></div>
              </div>
          
              <div class="segment">
                <div class="t-circle">
                  <div class="inner-circle"></div>
                </div>
                <div class="line"></div>
              </div>
          
              <div class="segment">

              <!-- Alternate-Best Way -->
              <img
                src="../assets/images/logos/creazen-parent-logo.png"
              />
            </div>

            <div class="signup-nav">
              <div class="log-title">Sign Up</div>
              <div class="toggle-switch">
                <input
                  type="radio"
                  id="candidate"
                  name="toggle"
                  class="toggle-input"
                  checked
                />
                <label for="candidate" class="toggle-option"
                  >As Candidate</label
                >
                <input
                  type="radio"
                  id="recruiter"
                  name="toggle"
                  class="toggle-input"
                />
                <label for="recruiter" class="toggle-option"
                  >As Recruiter</label
                >
                <div class="toggle-background"></div>
              </div>
            </div>

            <div class="create-ac">Create a Account</div>
            <div class="sub-line">
              Enter your details below to create your Account and get started
            </div>

            <div class="signup-container">
              <form class="signup-form">
                <label for="password">E-mail<span class="astrisk">*</span></label></label>
                <div class="password-container">
                    <input class="signup-form-input-f" type="text" id="E-mail" placeholder="">
                </div>


                <label for="cnfrm-password">Enter Password<span class="astrisk">*</span></label></label>
                <div class="password-container">
                    <input class="signup-form-input-f" type="password" id="cnfrm-password" placeholder="**************">
                </div>


                <div class="buttons">
                  <!-- <a class="continue-btn-anc" href="otp-pannel.html">Continue</a> -->
                  <button type="submit" class="continue-btn">Continue</button>
                  <button type="" class="back-btn">Back</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
