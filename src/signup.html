<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up</title>
  <link rel="stylesheet" href="../assets/css/singup.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <!-- fiirebase -->
  
</head>

<body>
  <div class="container">
    <div class="inner-container">
      <div class="left-container">
        <div class="img-overs-container">
          <img class="img-bg" src="../assets/images/login/img2.jpg" />
          <div class="text-logo"></div>
        </div>
      </div>

      <div class="right-container poppins">
        <div class="right-inner">
          <div class="p-bar">
            <!-- Alternate-Best Way -->
            <img src="../assets/images/logos/creazen-parent-logo.png" />
          </div>

          <div class="create-ac">Create a Account</div>
          <div class="sub-line">
            Enter your details below to create your Account and get started
          </div>

          <div class="signup-container">

            <form class="signup-form" id="signup-form">
              
              <label for="password">Email<span class="astrisk">*</span></label></label>
              <div class="password-container">
                <input class="signup-form-input-f" type="email" id="email" placeholder="xyz@email.com" required>
              </div>

              <label for="password">Enter Password<span class="astrisk">*</span></label></label>
              <div class="password-container">
                <input class="signup-form-input-f" type="password" id="password" placeholder="******" required>
              </div>


              <div class="buttons">
                <!-- <a class="continue-btn-anc" href="otp-pannel.html">Continue</a> -->
                <button id="submit" class="continue-btn">Continue</button>
                <a href="./login.html" class="back-btn">Already have an account?</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Link your separate JS file as a module -->
  <script type="module" src="../assets/js/signup.js"></script>
</body>
</html>
