<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />
</head>

<body class="poppins">
  <div class="container">
    <div class="inner-container">
      <div class="left-container">
        <div class="img-overs-container">
          <img class="img-bg" src="../assets/images/services/service-1.jpg" alt="Craft Login Showcase" />
          <div class="text-logo"></div>
        </div>
      </div>

      <div class="right-container poppins">
        <div class="log-nav">
          <div class="title-right">
            <div class="log-title">Welcome Back</div>
          </div>
          <div class="logo-hiremi">
            <a href="../index.html"><img src="../assets/images/logos/creazen-parent-logo.png" alt="Creazen Crafts Logo" /></a>
          </div>
        </div>

        <div class="login-container">
          <div class="demo-credentials-badge">
            <i class="fa-solid fa-key"></i> Demo Credentials: <strong>user@creazen.com</strong> / <strong>password123</strong>
          </div>
          <form class="login-form" id="login-form">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="name@email.com" required value="user@creazen.com" />

            <label for="password">Password</label>
            <div class="password-container">
              <input type="password" id="password" placeholder="Enter Your password" required value="password123" />
            </div>

            <div class="btn-position">
              <button type="submit" class="login-btn" id="loginBtn">Log In</button>
            </div>

            <p class="signup-text">
              Don’t have an account? <a href="./signup.html">Sign up</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
