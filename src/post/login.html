<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiremi-Login</title>
    <link rel="stylesheet" href="/creazen-crafts/assets/css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body class="poppins">
    <div class="container">
      <div class="inner-container">
        <div class="left-container">
          <div class="img-overs-container">
            <img class="img-bg" src="/creazen-crafts/assets/images/login/img4.avif"
            />

            <div class="text-logo"></div>
          </div>
        </div>

        <div class="right-container poppins">
          <div class="log-nav">
            <div class="title-right">
              <div class="log-title">Log in</div>
            </div>
            <div class="logo-hiremi"><img
              src="/creazen-crafts/assets/images/logos/creazen-parent-logo.png"
            /></div>
            
          </div>

          <div class="login-container">
            <form class="login-form">
              <label for="email">Email id</label>
              <input type="email" id="email" placeholder="name@email.com" />

              <label for="password">Password</label>
              <div class="password-container">
                <input
                  type="password"
                  id="password"
                  placeholder="Enter Your password"
                />
                
              </div>

              <div class="forget-password">
                <a href="#"
                  ><img
                    src="./images/Login-images/lock.png"
                    class="lock-icon"
                  />
                  Forget password</a
                >
              </div>

              <div class="btn-position">
                <button type="submit" class="login-btn">Login</button>
              </div>

              <p class="signup-text">
                Don’t have an account? <a href="./SignUP-1.html">Sign up</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="Js/Login.js"></script>
  </body>
</html>
